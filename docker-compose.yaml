version: '3.8'

services:
  job-scheduler:
    image: job-scheduler:latest
    environment:
      # Resolves via the shared network directly to the homeapi container
      - TARGET_API_URL=http://homeapi-v1:8080
    ports:
      - "3000:3000"
    networks:
      - home-network

networks:
  home-network:
    external: true
    name: home-network